name: Bug report
description: Report a reproducible problem with The Player.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Never paste LAN room URLs or tokens, credentials, private addresses, or personal local paths. Use placeholders or redact sensitive values instead.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest sequence that reliably shows the problem.
      placeholder: |
        1. Start the app with ...
        2. Open ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include safe error messages or screenshots if useful.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and version
      description: Include The Player version, OS, browser, and how you started it (local or LAN mode).
      placeholder: "The Player version: ...\nOS: ...\nBrowser: ...\nMode: ..."
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      description: Confirm that the report contains no secrets or private connection details.
      options:
        - label: I have redacted LAN room URLs/tokens, credentials, private addresses, and personal local paths.
          required: true
