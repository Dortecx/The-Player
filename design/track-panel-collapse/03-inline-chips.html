<!doctype html><html lang="es"><meta charset="utf-8"><title>Chips desktop</title><style>:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;color:#f6f7fb;background:#000}body{margin:0;padding:48px}.app{max-width:1280px;margin:auto;display:grid;grid-template-columns:2fr 1fr;gap:20px}.panel{background:rgba(10,10,12,.9);border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:18px}.video{height:520px;background:#111;border-radius:12px;display:grid;place-items:center;color:#aeb6c5}.tracks{margin-top:14px;display:flex;align-items:center;gap:10px}.label{color:#aeb6c5}.chip{border:1px solid rgba(255,255,255,.38);border-radius:99px;padding:8px 12px}.edit{margin-left:auto;color:#dfefff;font-weight:700}.list{color:#aeb6c5;line-height:2.8}@media(max-width:760px){body{padding:16px}.app{grid-template-columns:1fr}.video{height:220px}.tracks{flex-wrap:wrap}.edit{margin-left:0}}</style><main class="app"><section class="panel"><div class="video">Reproduciendo</div><div class="tracks"><span class="label">Pistas</span><span class="chip">♫ Español (5.1)</span><span class="chip">CC Español</span><span class="edit">Cambiar</span></div></section><aside class="panel"><b>Playlist</b><div class="list">▶ Película.mkv<br>Siguiente archivo<br>Otro episodio</div></aside></main></html>
