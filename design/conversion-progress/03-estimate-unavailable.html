<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conversion progress — ETA unavailable overlay</title>
<style>
:root { color-scheme:dark; --bg:#000; --panel:rgba(10,10,12,.9); --panel-strong:rgba(16,16,18,.92); --text:#f6f7fb; --muted:#aeb6c5; --accent:#dfefff; --line:rgba(223,239,255,.2); --glow:rgba(223,239,255,.22); }
* { box-sizing:border-box; }
body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:radial-gradient(circle at 50% 10%,#15171d 0,var(--bg) 52%); color:var(--text); font:15px/1.4 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
.player { width:min(960px,100%); border:1px solid var(--line); border-radius:16px; overflow:hidden; background:var(--panel); box-shadow:0 20px 56px #000; }
.video { position:relative; min-height:clamp(220px,48vw,510px); display:grid; place-items:center; padding:24px 24px 114px; background:linear-gradient(135deg,#15171b,#050506); color:var(--muted); text-align:center; }
.video p { margin:0; max-width:30ch; }
.overlay { position:absolute; right:12px; bottom:12px; left:12px; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px 16px; padding:10px 12px; border:1px solid var(--line); border-radius:12px; background:var(--panel-strong); box-shadow:0 10px 24px #0009; }
.copy { min-width:0; } .copy strong { display:block; } .copy span,.metrics { color:var(--muted); font-size:13px; } .metrics { display:flex; align-items:baseline; justify-content:flex-end; gap:12px; white-space:nowrap; } .metrics b { color:var(--text); font-size:15px; }
.track { grid-column:1/-1; height:7px; overflow:hidden; border-radius:999px; background:#282c34; } .fill { width:64%; height:100%; border-radius:inherit; background:var(--accent); }
@media (max-width:520px) { body { padding:12px; } .video { min-height:clamp(250px,75vw,430px); padding-bottom:154px; } .overlay { grid-template-columns:1fr; gap:5px; } .metrics { justify-content:space-between; white-space:normal; } }
@media (prefers-reduced-motion:reduce) { * { scroll-behavior:auto; } }
</style>
</head>
<body>
<main class="player" aria-label="Playback view">
  <section class="video" aria-label="Video player">
    <p>Compatible stream is being prepared before playback.</p>
    <section class="overlay" aria-labelledby="conversion-title" aria-live="polite">
      <div class="copy"><strong id="conversion-title">Preparing complete stream</strong><span>Progress is measured; a reliable finish time is not available.</span></div>
      <div class="metrics"><span><b>64%</b> complete</span><span>ETA <b>Unavailable</b></span></div>
      <div class="track" role="progressbar" aria-label="Conversion progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="64" aria-valuetext="64 percent complete. Estimated remaining time is unavailable."><div class="fill"></div></div>
    </section>
  </section>
</main>
</body>
</html>
