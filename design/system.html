<!doctype html><html lang="en"><meta charset="utf-8"><title>Reproductor system</title><style>:root{color-scheme:dark;--bg:#000;--panel:rgba(10,10,12,.9);--line:rgba(255,255,255,.38);--text:#f6f7fb;--muted:#aeb6c5;--accent:#dfefff;--success:#a8e8a0;--danger:#ff9a9a;font-family:Inter,ui-sans-serif,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);padding:48px}.board{max-width:1100px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:32px}h1{margin-top:0}.muted{color:var(--muted)}.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.swatch{border:1px solid var(--line);border-radius:12px;padding:14px}.chip{height:58px;border-radius:8px;margin-bottom:10px;border:1px solid var(--line)}button{border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.08);color:var(--text);font-weight:700;padding:12px 16px}button:focus-visible{outline:2px solid white;outline-offset:3px}@media(max-width:700px){body{padding:16px}.swatches{grid-template-columns:repeat(2,1fr)}}</style><main class="board"><p class="muted">Design system</p><h1>Reproductor</h1><p class="muted">Dark, high-contrast playback surfaces with restrained white feedback.</p><section class="swatches"><article class="swatch"><div class="chip" style="background:#000"></div>Background<br><small>#000</small></article><article class="swatch"><div class="chip" style="background:#f6f7fb"></div>Text<br><small>#f6f7fb</small></article><article class="swatch"><div class="chip" style="background:#a8e8a0"></div>Success<br><small>#a8e8a0</small></article><article class="swatch"><div class="chip" style="background:#ff9a9a"></div>Danger<br><small>#ff9a9a</small></article></section><h2>Controls</h2><button>Primary action</button> <button>Compact icon ◀</button><p class="muted">Transport labels expand only for precise hover input.</p></main></html>
